[project]
name = "local-jev"
version = "0.1.0"
description = "A Jev-compatible decision server on small local models"
readme = "README.md"
authors = [
    { name = "Pan", email = "kpkong@hk01.com" }
]
requires-python = "==3.12.*"
dependencies = [
    # torch 2.11 / torchvision 0.26 are the newest builds on the PyTorch CUDA 12.8 index,
    # so pin them now to get the same torch on every platform once that index is added.
    "torch==2.11.*",
    "torchvision==0.26.*",
    "transformers>=5.19",
    "pillow",
    "huggingface_hub",
    "fastapi",
    "uvicorn",
    "pydantic",
]

[project.scripts]
local-jev = "local_jev.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "httpx",
]

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
# Resolve only for the platforms local-jev runs on: the Mac, a Linux GPU host, Linux arm64 containers.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "-m", "not real_model"]
markers = [
    "real_model: loads real model weights; excluded by default, run with `-m real_model`",
]
